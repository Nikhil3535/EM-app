server {
    listen 80;

    # ===============================
    # 🌐 Frontend (React)
    # ===============================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # ===============================
    # 🔐 AUTH APIs (NO /api prefix in backend)
    # ===============================
    location ~ ^/api/(authenticate|register|reset-password)$ {
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://internal-a75c026945950414abeae30bd42d9d4b-2113349448.us-east-2.elb.amazonaws.com;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ===============================
    # 🔍 VERIFY USERNAME (GET with path param)
    # ===============================
    location ~ ^/api/verify-username/ {
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://internal-a75c026945950414abeae30bd42d9d4b-2113349448.us-east-2.elb.amazonaws.com;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Connection "";
    }

    # ===============================
    # 📊 MAIN APIs (already /api in backend)
    # ===============================
    location /api/ {
        proxy_pass http://internal-a75c026945950414abeae30bd42d9d4b-2113349448.us-east-2.elb.amazonaws.com;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}