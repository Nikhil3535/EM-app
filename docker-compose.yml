
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"   # 🔧 FIXED (was 80 → wrong)
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database-1.chaq4ig4g031.us-east-2.rds.amazonaws.com:3306/employee_management?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=Anirudh123
      - JWT_SECRET=mysecretkey123
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:                 # ✅ properly indented
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s