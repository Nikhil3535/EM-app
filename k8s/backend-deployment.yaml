apiVersion: apps/v1
kind: Deployment

metadata:
name: backend-deployment

spec:
replicas: 1

selector:
matchLabels:
app: backend

template:
metadata:
labels:
app: backend

```
spec:
  containers:
    - name: backend
      image: niki2003/employee-backend:latest

      ports:
        - containerPort: 8080

      env:
        - name: MYSQL_HOST
          value: mysql-service

        - name: MYSQL_PORT
          value: "3306"

        - name: MYSQL_DB
          value: employee_management

        - name: MYSQL_USER
          value: employeeuser

        - name: MYSQL_PASSWORD
          value: "nikhil@02"

        