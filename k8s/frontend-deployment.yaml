apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment

  labels:
    app: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"

    spec:
      containers:

        - name: frontend

          image: niki2003/employee-frontend:latest

          ports:
            - containerPort: 3000

        - name: port-logger

          image: busybox

          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "=============================="
                echo "Port check at $(date)"
                echo "Frontend expected on port 3000"
                netstat -tuln || ss -tuln
                echo "=============================="
                sleep 30
              done
