apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: secrets-em-app

      containers:
        - name: backend
          image: niki2003/employee-backend:latest

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: em-app-db