apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: secrets-em-app

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: em-db-secrets

      containers:
        - name: backend
          image: niki2003/employee-backend:latest

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: em-app-db

          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
