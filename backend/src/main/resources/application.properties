# Import Environment Variables from config.properties file
spring.config.import=optional:file:config.properties

# Spring Boot Application Configuration
spring.application.name=Employee-Management
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:employee_management}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}

spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.connection-timeout=3000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB Configuration (optional — not currently used by any repository)
spring.data.mongodb.uri=${MONGO_URI:}
spring.data.mongodb.auto-index-creation=false

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
