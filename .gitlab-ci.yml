stages:
  - docker
  - setup_cluster
  - k8s_deploy

variables:
  DOCKER_IMAGE_BACKEND: "$DOCKER_USERNAME/employee-backend:$CI_COMMIT_SHORT_SHA"
  DOCKER_IMAGE_FRONTEND: "$DOCKER_USERNAME/employee-frontend:$CI_COMMIT_SHORT_SHA"
  AWS_REGION: "us-east-2"
  EKS_CLUSTER_NAME: "employee-cluster"
  DOCKER_TLS_CERTDIR: ""

# -----------------------------
# DOCKER BUILD & PUSH
# -----------------------------
docker_build_push:
  stage: docker
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  script:
    - docker build -t $DOCKER_IMAGE_BACKEND backend/
    - docker push $DOCKER_IMAGE_BACKEND

    - docker build -t $DOCKER_IMAGE_FRONTEND frontend/
    - docker push $DOCKER_IMAGE_FRONTEND

# -----------------------------
# ONE-TIME CLUSTER SETUP
# -----------------------------
setup_csi_driver:
  stage: setup_cluster
  image: alpine:latest
  when: manual

  before_script:
    - apk add --no-cache curl bash aws-cli

    # install kubectl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/

    # install helm
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    # AWS auth
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_KEY
    - export AWS_DEFAULT_REGION=$AWS_REGION

    - aws sts get-caller-identity
    - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

  script:
    - echo "===== INSTALL CSI DRIVER ====="

    - helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
    - helm repo update

    - helm upgrade --install csi-secrets-store \
        secrets-store-csi-driver/secrets-store-csi-driver \
        --namespace kube-system \
        --create-namespace \
        --set syncSecret.enabled=true \
        --set installCRDs=true

    - echo "===== INSTALL AWS PROVIDER ====="
    - kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml

    - echo "===== VERIFY CSI ====="
    - kubectl get pods -n kube-system

# -----------------------------
# KUBERNETES DEPLOY
# -----------------------------
k8s_deploy:
  stage: k8s_deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache curl bash aws-cli

    # install kubectl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/

    # AWS auth
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_KEY
    - export AWS_DEFAULT_REGION=$AWS_REGION

    - aws sts get-caller-identity
    - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

  script:
    - kubectl config current-context
    - kubectl get pods -n kube-system
    - kubectl get crds | grep secretprovider
    - echo "===== APPLY SECRET PROVIDER ====="
    - kubectl apply -f secret-provider.yaml

    - echo "===== WAIT FOR SECRET SYNC ====="
    - sleep 20

    - echo "===== VERIFY SECRET ====="
    - kubectl get secret em-db-secret || true

    - echo "===== APPLY SERVICES ====="
    - kubectl apply -f backend-service.yaml
    - kubectl apply -f frontend-service.yaml

    - echo "===== APPLY DEPLOYMENTS ====="
    - kubectl apply -f backend-deployment.yaml
    - kubectl apply -f frontend-deployment.yaml

    - echo "===== UPDATE IMAGES ====="
    - kubectl set image deployment/backend-deployment backend=$DOCKER_IMAGE_BACKEND
    - kubectl set image deployment/frontend-deployment frontend=$DOCKER_IMAGE_FRONTEND

    - echo "===== RESTART BACKEND ====="
    - kubectl rollout restart deployment/backend-deployment

    - echo "===== WAIT FOR ROLLOUT ====="
    - kubectl rollout status deployment/backend-deployment --timeout=180s
    - kubectl rollout status deployment/frontend-deployment --timeout=180s

    - echo "===== DEBUG INFO ====="
    - kubectl get pods -o wide
    - kubectl get svc
    - kubectl get endpoints backend-service

    - echo "===== BACKEND LOGS ====="
    - kubectl logs -l app=backend --tail=100

    - echo "===== DESCRIBE BACKEND ====="
    - kubectl describe pod -l app=backend